dependencies:
  # 使用包含 ESP32-C3 NimBLE 修复的补丁版本；SDK 源码在工程外安装。
  idf: ">=5.5.6,<5.6.0"
  # SDK 升级期间固定 UI 版本，避免把不同组件变化混成一次验证。
  lvgl/lvgl: "9.5.0"
  # 构建辅助组件独立做 A/B 对照，固定版本以便重复验证。
  espressif/cmake_utilities: "1.3.0"
  espressif/esp_lvgl_port: "2.9.0"
  espressif/button: "4.2.0"
  espressif/esp_codec_dev: "1.6.2"
